# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    cooldown:
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      fontawesome:
        patterns:
          - "@fortawesome/*"
        applies-to: version-updates
      types:
        patterns:
          - "@types/*"
        applies-to: version-updates
      rapideditor:
        patterns:
          - "@rapideditor/*"
        applies-to: version-updates
      turf:
        patterns:
          - "@turf/*"
        applies-to: version-updates
      eslint:
        patterns:
          - "@eslint/*"
          - "eslint"
          - "typescript-eslint"
        applies-to: version-updates
      cldr:
        patterns:
          - "cldr*"
        applies-to: version-updates
      vite:
        patterns:
          - "vite*"
        applies-to: version-updates
    labels:
      - "chore-dependabot"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        applies-to: version-updates
    labels:
      - "chore-dependabot"
